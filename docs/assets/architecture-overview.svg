<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="880" height="460" rx="16" fill="#0a0f1a"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="22" font-weight="700">Restaurant Vision Analytics — Architecture</text>
  <text x="32" y="68" fill="#64748b" font-size="13">Anonymous, aggregate-only pipeline. No imagery, identity, or biometrics cross into storage.</text>

  <!-- Detector -->
  <rect x="32" y="110" width="200" height="120" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="138" fill="#34d399" font-size="13" font-weight="700">DETECTOR</text>
  <text x="48" y="162" fill="#cbd5e1" font-size="12">Synthetic (demo)</text>
  <text x="48" y="182" fill="#cbd5e1" font-size="12">OpenCV HOG (optional)</text>
  <text x="48" y="202" fill="#cbd5e1" font-size="12">Your adapter (YOLO…)</text>
  <text x="48" y="220" fill="#64748b" font-size="11">→ anonymous person boxes</text>

  <!-- Arrow -->
  <line x1="232" y1="170" x2="300" y2="170" stroke="#34d399" stroke-width="2"/>
  <polygon points="300,165 312,170 300,175" fill="#34d399"/>

  <!-- Analytics engine -->
  <rect x="312" y="96" width="260" height="172" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="332" y="124" fill="#34d399" font-size="13" font-weight="700">ANALYTICS ENGINE</text>
  <text x="332" y="150" fill="#cbd5e1" font-size="12">Ephemeral tracker (TTL, no re-id)</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">Occupancy · Queue pressure</text>
  <text x="332" y="194" fill="#cbd5e1" font-size="12">Table usage · Heatmap</text>
  <rect x="332" y="212" width="220" height="40" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="344" y="237" fill="#6ee7b7" font-size="11">aggregate snapshot — numbers only</text>

  <!-- Arrows to outputs -->
  <line x1="572" y1="150" x2="650" y2="120" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="650,114 662,118 652,126" fill="#38bdf8"/>
  <line x1="572" y1="182" x2="650" y2="182" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="650,177 662,182 650,187" fill="#38bdf8"/>
  <line x1="572" y1="214" x2="650" y2="244" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="650,238 662,248 650,250" fill="#38bdf8"/>

  <!-- Outputs -->
  <rect x="662" y="96" width="186" height="44" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="678" y="123" fill="#e2e8f0" font-size="12" font-weight="600">WebSocket live feed</text>

  <rect x="662" y="160" width="186" height="44" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="678" y="187" fill="#e2e8f0" font-size="12" font-weight="600">REST API /api/*</text>

  <rect x="662" y="224" width="186" height="44" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="678" y="245" fill="#e2e8f0" font-size="12" font-weight="600">SQLite / Postgres</text>
  <text x="678" y="260" fill="#64748b" font-size="10">aggregate rows only</text>

  <!-- Privacy boundary line -->
  <line x1="292" y1="300" x2="848" y2="300" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="32" y="304" fill="#f59e0b" font-size="11" font-weight="700">PRIVACY BOUNDARY</text>
  <text x="300" y="324" fill="#94a3b8" font-size="11">Everything to the right of the detector output sees only anonymous geometry and counts.</text>

  <!-- Frontend -->
  <rect x="32" y="346" width="816" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="374" fill="#34d399" font-size="13" font-weight="700">DASHBOARD (React + TypeScript)</text>
  <text x="48" y="398" fill="#cbd5e1" font-size="12">Live occupancy · Queue pressure · Table map · Heatmap · Alerts · Privacy badge</text>
  <text x="48" y="416" fill="#64748b" font-size="11">Dark operations UI · responsive · demo mode indicator</text>
</svg>
