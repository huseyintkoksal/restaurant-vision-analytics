<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="880" height="360" rx="16" fill="#0a0f1a"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="22" font-weight="700">Demo Mode — Synthetic Customer Flow</text>
  <text x="32" y="68" fill="#64748b" font-size="13">Anonymous agents move through the venue, driving realistic occupancy, queue and table metrics — no camera, no real footage.</text>

  <!-- Lifecycle stages -->
  <g>
    <rect x="32" y="120" width="140" height="86" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="50" y="150" fill="#38bdf8" font-size="13" font-weight="700">1 · ARRIVE</text>
    <text x="50" y="174" fill="#cbd5e1" font-size="12">enter at door</text>
    <text x="50" y="192" fill="#64748b" font-size="11">entrance zone</text>
  </g>
  <g>
    <rect x="204" y="120" width="140" height="86" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="222" y="150" fill="#f59e0b" font-size="13" font-weight="700">2 · QUEUE</text>
    <text x="222" y="174" fill="#cbd5e1" font-size="12">wait in line</text>
    <text x="222" y="192" fill="#64748b" font-size="11">queue pressure</text>
  </g>
  <g>
    <rect x="376" y="120" width="140" height="86" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="394" y="150" fill="#a78bfa" font-size="13" font-weight="700">3 · SEAT</text>
    <text x="394" y="174" fill="#cbd5e1" font-size="12">walk to table</text>
    <text x="394" y="192" fill="#64748b" font-size="11">table occupied</text>
  </g>
  <g>
    <rect x="548" y="120" width="140" height="86" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="566" y="150" fill="#34d399" font-size="13" font-weight="700">4 · DINE</text>
    <text x="566" y="174" fill="#cbd5e1" font-size="12">dwell &amp; turnover</text>
    <text x="566" y="192" fill="#64748b" font-size="11">dwell time</text>
  </g>
  <g>
    <rect x="720" y="120" width="128" height="86" rx="12" fill="#0f172a" stroke="#64748b" stroke-opacity="0.5"/>
    <text x="738" y="150" fill="#94a3b8" font-size="13" font-weight="700">5 · LEAVE</text>
    <text x="738" y="174" fill="#cbd5e1" font-size="12">exit venue</text>
    <text x="738" y="192" fill="#64748b" font-size="11">id forgotten</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2">
    <line x1="172" y1="163" x2="200" y2="163"/><polygon points="200,158 212,163 200,168" fill="#475569"/>
    <line x1="344" y1="163" x2="372" y2="163"/><polygon points="372,158 384,163 372,168" fill="#475569"/>
    <line x1="516" y1="163" x2="544" y2="163"/><polygon points="544,158 556,163 544,168" fill="#475569"/>
    <line x1="688" y1="163" x2="716" y2="163"/><polygon points="716,158 728,163 716,168" fill="#475569"/>
  </g>

  <!-- ephemeral note -->
  <rect x="32" y="244" width="816" height="84" rx="12" fill="#34d399" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="48" y="272" fill="#6ee7b7" font-size="13" font-weight="700">Each agent is an anonymous moving point</text>
  <text x="48" y="296" fill="#cbd5e1" font-size="12">Track ids are short-lived and never persisted. When an agent leaves, its id is forgotten —</text>
  <text x="48" y="316" fill="#cbd5e1" font-size="12">a returning point is treated as brand new. There is no re-identification, ever.</text>
</svg>
