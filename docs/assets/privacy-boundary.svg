<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="880" height="420" rx="16" fill="#0a0f1a"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="22" font-weight="700">The Privacy Boundary</text>
  <text x="32" y="68" fill="#64748b" font-size="13">Identification is impossible by design — there is no code path from a frame to a person.</text>

  <!-- Camera/frame -->
  <rect x="32" y="120" width="170" height="150" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="148" fill="#94a3b8" font-size="12" font-weight="700">FRAME (in memory)</text>
  <circle cx="86" cy="196" r="20" fill="#1e293b"/>
  <rect x="120" y="178" width="60" height="60" rx="6" fill="none" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="48" y="258" fill="#64748b" font-size="11">never stored by default</text>

  <line x1="202" y1="195" x2="262" y2="195" stroke="#475569" stroke-width="2"/>
  <polygon points="262,190 274,195 262,200" fill="#475569"/>

  <!-- Detector -->
  <rect x="274" y="120" width="180" height="150" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="290" y="148" fill="#34d399" font-size="12" font-weight="700">DETECTOR</text>
  <rect x="300" y="166" width="44" height="76" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="356" y="196" fill="#cbd5e1" font-size="12">bbox</text>
  <text x="356" y="216" fill="#cbd5e1" font-size="12">confidence</text>
  <text x="356" y="236" fill="#cbd5e1" font-size="12">label="person"</text>

  <line x1="454" y1="195" x2="514" y2="195" stroke="#34d399" stroke-width="2"/>
  <polygon points="514,190 526,195 514,200" fill="#34d399"/>

  <!-- Analytics -->
  <rect x="526" y="120" width="320" height="150" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="544" y="148" fill="#34d399" font-size="12" font-weight="700">AGGREGATE ANALYTICS</text>
  <text x="544" y="172" fill="#cbd5e1" font-size="12">counts · pressures · turnover · density</text>
  <text x="544" y="196" fill="#cbd5e1" font-size="12">ephemeral track ids (TTL, no re-id)</text>
  <text x="544" y="220" fill="#cbd5e1" font-size="12">→ WebSocket · REST · database</text>
  <text x="544" y="248" fill="#64748b" font-size="11">nothing here can single out an individual</text>

  <!-- What never crosses -->
  <rect x="32" y="300" width="816" height="92" rx="12" fill="#7f1d1d" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/>
  <text x="48" y="328" fill="#fca5a5" font-size="13" font-weight="700">NEVER produced or stored — by design</text>
  <text x="48" y="352" fill="#fecaca" font-size="12">✕ Faces   ✕ Biometrics   ✕ Identity   ✕ Re-identification   ✕ Age / Gender / Ethnicity</text>
  <text x="48" y="374" fill="#fecaca" font-size="12">✕ Emotion   ✕ Audio   ✕ Persistent customer tracking   ✕ Raw video storage (default)</text>
</svg>
