[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-vision-analytics"
version = "0.1.1"
description = "Privacy-first open-source computer vision toolkit for restaurant occupancy, queue, table usage and customer flow analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Restaurant Vision Analytics contributors" }]
keywords = [
    "computer-vision",
    "restaurant",
    "analytics",
    "occupancy",
    "queue-monitoring",
    "privacy-first",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlmodel>=0.0.16",
    "websockets>=12.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy / optional vision backends. Not required for demo mode or tests.
opencv = ["opencv-python-headless>=4.9"]
# Optional PostgreSQL driver.
postgres = ["psycopg[binary]>=3.1"]
# Development & test tooling.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/huseyintkoksal/restaurant-vision-analytics"
Documentation = "https://github.com/huseyintkoksal/restaurant-vision-analytics/tree/main/docs"
Issues = "https://github.com/huseyintkoksal/restaurant-vision-analytics/issues"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends/Query)

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
